# dsh-migrate-on-429 bundle patch
# 429 迁移插件：会话频繁触发 RATE_LIMIT（通常因上下文过长导致 TPM 限流）时，
# 先自动 continue 重试若干次；仍持续失败则总结当前会话并迁移到新会话继续任务。
# 宿主端：监听 agent/request-error + session/event turn/end，统计 429 频率，
#         达到阈值后 cancel 旧会话（保证交接而非并行）、生成交接摘要、
#         以 ctx.agents.create 创建全新会话并注入交接 prompt 继续任务。
# 客户端：对话框底部 429 计数/迁移状态指示 + 开关；设置页可调迁移阈值。
- insert:
    - id: migrate-on-429
      name: dsh-migrate-on-429
